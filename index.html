/* ================================================================
   MULTI-CHAPTER IMPORT (paste / upload one JSON for a whole course)
   Format:  { format:"politics-quiz-import", version:"1.0",
              book:"教材名", course:"课程名",
              chapters:[ { name:"第一章 …", questions:[ <题目对象> ] } ] }
   Re-uses normalizeQuestion() so the question fields are exactly the ones the
   rest of the app already uses (type / question / options / answer /
   explanation / material / subQuestions).  options may be an array or a
   {"A":…,"B":…} map — the same mapping layer the single-chapter import had.
   Nothing is written until the whole file validated AND the user confirmed.
   ================================================================ */
let multiCtx = null;   // { bookId, courseId, text, filename, plan, parsed, opts }

function multiSig(q) {
  const body = String(q.question || q.material || '').replace(/\s+/g, '').slice(0, 200);
  const ans = Array.isArray(q.answer) ? q.answer.join('') : String(q.answer == null ? '' : q.answer);
  return q.type + '|' + body + '|' + ans.replace(/\s+/g, '');
}
function optionsMapToArray(raw) {
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return raw;
  const LETTERS_ = 'ABCDEFGH';
  const keys = Object.keys(raw);
  const onlyLetters = keys.length > 0 && keys.every(k => /^[A-Ha-h]$/.test(k));
  if (!onlyLetters) return raw;
  return keys.sort((a, b) => LETTERS_.indexOf(a.toUpperCase()) - LETTERS_.indexOf(b.toUpperCase()))
    .map(k => k.toUpperCase() + '. ' + String(raw[k] == null ? '' : raw[k]).replace(/\s*\n\s*/g, ' ').trim());
}
function fmtCourseLabel(co) { return co ? (co.short ? co.short + '（' + co.name + '）' : co.name) : '未分类'; }

/* ---------- pure validation / matching ---------- */
function parseMultiChapterPayload(data, ctx) {
  const out = { ok: false, fatal: null, notices: [], chapters: [], totals: { chapters: 0, questions: 0, ok: 0, dup: 0, err: 0 } };
  const b = getBook(ctx.bookId), co = getCourse(ctx.courseId);
  if (!b || !co) { out.fatal = '目标教材或课程不存在'; return out; }
  if (!data || typeof data !== 'object' || Array.isArray(data)) { out.fatal = 'JSON 顶层必须是一个对象（{ "chapters": [ … ] }）'; return out; }
  if (data.passages || data.grammarQuestions || data.quizSets || data.roadmap) { out.fatal = '这是英语 Quiz Hub 的数据，不能导入到政治版'; return out; }
  if (data.kind === 'politics-backup') { out.fatal = '这是整库备份文件，请用 Backup → Import Backup 恢复'; return out; }
  if (data.kind === 'politics-book') { out.fatal = '这是「单本书导出」文件，请用教材卡片上的 Import 导入'; return out; }

  /* textbook/course guard — a 习概 file can never land in 毛概 */
  const bookName = data.book == null ? '' : String(data.book).trim();
  if (bookName && normChapterName(bookName) !== normChapterName(b.name)) {
    out.fatal = '导入文件里的教材是「' + bookName + '」，当前教材是「' + b.name + '」。为防止导错教材，已停止导入。请先打开正确的教材再试。';
    return out;
  }
  const courseName = data.course == null ? '' : String(data.course).trim();
  if (courseName) {
    const n = normChapterName(courseName);
    const cand = [co.name, co.short].filter(Boolean).map(normChapterName);
    const hit = cand.some(x => x && (x === n || x.indexOf(n) >= 0 || n.indexOf(x) >= 0));
    if (!hit) {
      out.fatal = '导入文件里的课程是「' + courseName + '」，当前课程是「' + fmtCourseLabel(co) + '」。为防止把课程题目混在一起，已停止导入。请先进入正确的课程再试。';
      return out;
    }
  }
  let list = null;
  if (Array.isArray(data.chapters)) list = data.chapters;
  else if (Array.isArray(data.questions)) {
    const nm = String(data.chapter == null ? '' : data.chapter).trim() || String(data.chapterName == null ? '' : data.chapterName).trim();
    if (!nm) { out.fatal = '这个文件只有 questions，没有 chapters（也没有 chapter 名称）。请使用多章节格式，或到单个章节里用 Import 导入。'; return out; }
    list = [{ name: nm, questions: data.questions }];
    out.notices.push('文件只有一章（' + nm + '），按单章处理。');
  }
  if (!list || !list.length) { out.fatal = '找不到 chapters 数组（应形如 { "chapters": [ { "name": "第一章 …", "questions": [...] } ] }）'; return out; }

  const existing = chaptersOfCourse(b.id, co.id);
  const byNorm = {};
  existing.forEach(c => { const k = normChapterName(c.name); (byNorm[k] = byNorm[k] || []).push(c); });
  const usedTargets = new Set();
  const seenInFile = {};   // normName -> srcName (duplicate chapter entries inside one file)

  list.forEach((rawCh, ci) => {
    const rec = { idx: ci, srcName: '', no: null, status: 'new', targetId: '', candidates: [], questions: [],
                  chapterErrors: [], skipped: false, skipReasons: [], key: '' };
    const name = rawCh && typeof rawCh === 'object' ? String(rawCh.name == null ? (rawCh.chapter == null ? '' : rawCh.chapter) : rawCh.name).trim() : '';
    rec.srcName = name || ('（第 ' + (ci + 1) + ' 项没有名称）');
    if (!name) { rec.status = 'error'; rec.chapterErrors.push('这一项没有章节名称（name）'); out.chapters.push(rec); return; }
    rec.key = normChapterName(name);
    rec.no = chapterNoOf(name);
    if (seenInFile[rec.key]) out.notices.push('文件里章节「' + name + '」出现了多次，会合并到同一章节。');
    seenInFile[rec.key] = name;

    /* ---- matching: name first, then a UNIQUE chapter number inside this course ---- */
    const sameName = (byNorm[rec.key] || []).filter(c => !usedTargets.has(c.id));
    if (sameName.length === 1) { rec.status = 'matched'; rec.targetId = sameName[0].id; }
    else if (sameName.length > 1) { rec.status = 'ambiguous'; rec.candidates = sameName.map(c => ({ id: c.id, name: c.name })); }
    else if (rec.no != null) {
      const sameNo = existing.filter(c => !usedTargets.has(c.id) && chapterNoOf(c.name) === rec.no);
      if (sameNo.length === 1) {
        rec.status = 'loose'; rec.targetId = sameNo[0].id;
        rec.skipReasons.push('章节名不完全一致，按序号匹配到「' + sameNo[0].name + '」');
      } else if (sameNo.length > 1) {
        rec.status = 'ambiguous'; rec.candidates = sameNo.map(c => ({ id: c.id, name: c.name }));
        rec.skipReasons.push('有多个章节可能是目标，请选择');
      }
    }
    if (rec.status === 'new') {
      const otherCourse = S.chapters.find(c => c.bookId === b.id && c.courseId !== co.id && normChapterName(c.name) === rec.key);
      rec.skipReasons.push(otherCourse ? '同名章节在别的课程里，本课程中会新建' : '本课程中没有这个章节，会新建');
    }
    if (rec.targetId) usedTargets.add(rec.targetId);

    /* ---- questions ---- */
    const qs = rawCh && Array.isArray(rawCh.questions) ? rawCh.questions
      : (rawCh && Array.isArray(rawCh.items) ? rawCh.items : null);
    if (!qs) { rec.chapterErrors.push('缺少 questions 数组'); rec.status = 'error'; out.chapters.push(rec); return; }
    if (!qs.length) { rec.skipReasons.push('这一章没有题目（只创建/匹配章节，不写入题目）'); }
    const dupKeys = new Set();
    if (rec.targetId) questionsOfChapter(rec.targetId).forEach(q => dupKeys.add(multiSig(q)));
    qs.forEach((rawQ, qi) => {
      const q2 = (rawQ && typeof rawQ === 'object' && !Array.isArray(rawQ)) ? Object.assign({}, rawQ) : rawQ;
      if (q2 && typeof q2 === 'object' && q2.options) q2.options = optionsMapToArray(q2.options);
      const r = normalizeQuestion(q2);
      const item = { idx: qi, q: r.q, errors: r.errors, dup: false, note: '' };
      if (r.q) {
        const sig = multiSig(r.q);
        if (dupKeys.has(sig)) { item.dup = true; item.note = '与已有题目或文件内前面的题目重复'; }
        else dupKeys.add(sig);
      }
      rec.questions.push(item);
    });
    out.chapters.push(rec);
  });

  /* totals */
  out.chapters.forEach(rec => {
    out.totals.chapters++;
    out.totals.questions += rec.questions.length;
    rec.questions.forEach(it => { if (it.errors.length) out.totals.err++; else if (it.dup) out.totals.dup++; else out.totals.ok++; });
    if (rec.chapterErrors.length) out.totals.err++;
  });
  out.ok = !out.fatal;
  return out;
}
function multiStats(plan) {
  const s = { newCh: 0, matched: 0, skipped: 0, blocked: 0, ok: 0, dup: 0, err: 0, questions: 0 };
  if (!plan) return s;
  plan.chapters.forEach(rec => {
    s.questions += rec.questions.length;
    rec.questions.forEach(it => { if (it.errors.length) s.err++; else if (it.dup) s.dup++; else s.ok++; });
    if (rec.skipImport) { s.skipped++; return; }
    if (rec.chapterErrors.length && !rec.skipErrors) { s.blocked++; return; }
    if (rec.status === 'new') s.newCh++;
    else if (rec.status === 'ambiguous' && !rec.targetId) { s.blocked++; }
    else if (rec.status === 'loose' && !rec.confirmed) { s.blocked++; }   // unsure → ask first
    else s.matched++;
  });
  return s;
}
function commitMultiImport(ctx) {
  const plan = ctx.plan;
  if (!plan) throw new Error('还没有解析结果');
  const b = getBook(ctx.bookId), co = getCourse(ctx.courseId);
  if (!b || !co) throw new Error('目标教材/课程不存在');
  const now = Date.now();
  const newChapters = [], newQuestions = [];
  let chaptersCreated = 0, chaptersUsed = 0, added = 0, skippedDup = 0, skippedErr = 0, skippedChapters = 0;
  const perChapter = [];
  plan.chapters.forEach(rec => {
    const line = { name: rec.srcName, created: false, added: 0, dup: 0, err: 0, skipped: false, note: '' };
    if (rec.skipImport) { skippedChapters++; line.skipped = true; line.note = '按你的选择跳过'; perChapter.push(line); return; }
    if (rec.status === 'loose' && !rec.confirmed) { skippedChapters++; line.skipped = true; line.note = '匹配关系未确认，已跳过'; perChapter.push(line); return; }
    const fatalChapterErr = rec.chapterErrors.length && !rec.skipErrors;
    if (fatalChapterErr) { skippedChapters++; line.skipped = true; line.note = '章节结构有错误'; skippedErr += rec.questions.length; perChapter.push(line); return; }
    let target = rec.targetId ? getChapter(rec.targetId) : null;
    if (target && target.courseId !== co.id) {           // never write into another course
      skippedChapters++; line.skipped = true; line.note = '目标章节不属于当前课程，已跳过'; perChapter.push(line); return;
    }
    if (!target) {
      if (rec.status === 'ambiguous' || (!rec.targetId && rec.status !== 'new' && rec.status !== 'loose')) {
        skippedChapters++; line.skipped = true; line.note = '匹配关系未确认，已跳过'; perChapter.push(line); return;
      }
      target = { id: uid('ch'), bookId: b.id, courseId: co.id, name: rec.srcName, createdAt: now + newChapters.length };
      newChapters.push(target); chaptersCreated++; line.created = true;
    } else chaptersUsed++;
    rec.questions.forEach((it, i) => {
      if (it.errors.length) { skippedErr++; line.err++; return; }
      if (it.dup && ctx.opts.skipDup) { skippedDup++; line.dup++; return; }
      newQuestions.push(Object.assign({ id: uid('q'), bookId: b.id, chapterId: target.id, createdAt: now + added + i }, it.q));
      added++; line.added++;
    });
    perChapter.push(line);
  });
  if (!newChapters.length && !newQuestions.length) {
    return { nothing: true, perChapter: perChapter, added: 0, chaptersCreated: 0, chaptersUsed: chaptersUsed,
             skippedDup: skippedDup, skippedErr: skippedErr, skippedChapters: skippedChapters };
  }
  /* single write */
  S = Object.assign({}, S, {
    chapters: S.chapters.concat(newChapters),
    questions: S.questions.concat(newQuestions)
  });
  save();
  render();
  toast('已导入 ' + added + ' 题' + (chaptersCreated ? '，新建 ' + chaptersCreated + ' 个章节' : ''), 3200);
  return { perChapter: perChapter, added: added, chaptersCreated: chaptersCreated, chaptersUsed: chaptersUsed,
           skippedDup: skippedDup, skippedErr: skippedErr, skippedChapters: skippedChapters };
}

function multiPlanHTML(ctx, b, co) {

  const optHtml = (rec) => {

    return `<select class="pol-select" style="max-width:190px;" onchange="setMultiTarget(${rec.idx}, this.value)">
        <option value="__new__" ${!rec.targetId ? 'selected' : ''}>＋ 新建章节</option>${opts}</select>`;
  };
  let h = `<div class="pol-note" style="line-height:1.9;">

      : '<span class="pol-badge new">新建章节</span>';
    const nOk = rec.questions.filter(q => !q.errors.length && !q.dup).length;
    const nDup = rec.questions.filter(q => !q.errors.length && q.dup).length;
    const nErr = rec.questions.filter(q => q.errors.length).length;
    h += `<div class="pol-plan-row" style="flex-wrap:wrap;">
      <div class="pol-plan-main">
        <div class="pol-plan-name">${esc(rec.srcName)}</div>
        <div class="pol-plan-sub">${rec.questions.length} 题：可导入 ${nOk}${nDup ? ' · 重复 ' + nDup : ''}${nErr ? ' · 错误 ' + nErr : ''}${rec.skipReasons.length ? ' · ' + esc(rec.skipReasons.join('；')) : ''}</div>
      </div>
      ${badge}
      ${!(rec.chapterErrors.length && !rec.skipErrors) ? `<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;width:100%;margin-top:8px;">
        <span class="bar-sub">导入到：</span>${optHtml(rec)}
        <label class="pol-check" style="margin:0;"><input type="checkbox" ${rec.skipImport ? 'checked' : ''} onchange="setMultiSkip(${rec.idx}, this.checked)"><span>跳过这一章</span></label>
      </div>` : ''}
      ${rec.status === 'loose' ? `<label class="pol-check" style="margin-top:8px;width:100%;"><input type="checkbox" ${rec.confirmed ? 'checked' : ''} onchange="setMultiConfirm(${rec.idx}, this.checked)"><span>确认：这一章的题目就导入到上面选择/匹配的章节（名称不完全一致，需要你确认）</span></label>` : ''}
      ${rec.chapterErrors.length ? `<div class="pol-note warn" style="margin-top:8px;">❌ ${esc(rec.chapterErrors.join('；'))}
        <label class="pol-check" style="margin-top:6px;"><input type="checkbox" ${rec.skipErrors ? 'checked' : ''} onchange="setMultiSkipErrors(${rec.idx}, this.checked)"><span>跳过这一章继续导入</span></label></div>` : ''}
      ${nErr ? `<details style="margin-top:8px;width:100%;"><summary class="bar-sub" style="cursor:pointer;">查看 ${nErr} 处题目错误</summary><ul class="err-list">${rec.questions.filter(q => q.errors.length).slice(0, 30).map(q => `<li>第 ${q.idx + 1} 题：${esc(q.errors.join('；'))}</li>`).join('')}</ul></details>` : ''}
      ${nDup ? `<details style="margin-top:6px;width:100%;"><summary class="bar-sub" style="cursor:pointer;">查看重复题目</summary><ul class="err-list">${rec.questions.filter(q => q.dup).slice(0, 20).map(q => `<li>第 ${q.idx + 1} 题：${esc(String((q.q && q.q.question) || '').slice(0, 40))}…</li>`).join('')}</ul></details>` : ''}

  });
  h += `</div>
    <div class="pol-note">确认后：新建 <b>${st.newCh}</b> 个章节，写入约 <b>${st.ok}</b> 道题${st.dup ? '，跳过 ' + st.dup + ' 道重复题' : ''}${st.err ? '，忽略 ' + st.err + ' 处错误数据' : ''}。整个过程一次性提交，失败不会留下半成品。</div>`;
  return h;
}
function setMultiTarget(idx, val) {

}
function setMultiConfirm(idx, v) {

function parseMultiImport() {
  if (!multiCtx) return;
  const ta = document.getElementById('polMultiArea');
  multiCtx.text = ta ? ta.value : '';
  multiCtx.error = null; multiCtx.plan = null;
  if (!String(multiCtx.text).trim()) { multiCtx.error = '还没有粘贴 JSON'; renderMultiBody(); return; }
  let data;
  const clean = sanitizeJSON(multiCtx.text);
  try { data = JSON.parse(clean); }
  catch (e) {
    try { data = JSON.parse(clean.replace(/[\u201c\u201d]/g, '"')); }
    catch (e2) { multiCtx.error = 'JSON 格式错误：' + jsonErrorHint(e, clean); renderMultiBody(); return; }
  }
  const plan = parseMultiChapterPayload(data, { bookId: multiCtx.bookId, courseId: multiCtx.courseId });
  if (plan.fatal) { multiCtx.error = plan.fatal; renderMultiBody(); return; }
  multiCtx.plan = plan;
  renderMultiBody();
  toast('解析完成：' + plan.chapters.length + ' 个章节 · ' + plan.totals.questions + ' 道题', 2600);
}
function clearMultiImport() {
  if (!multiCtx) return;
  multiCtx.text = ''; multiCtx.plan = null; multiCtx.error = null; multiCtx.filename = '';
  renderMultiBody();
}
function handleMultiFile(ev) {
  const f = ev.target.files && ev.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    ev.target.value = '';
    if (!multiCtx) return;
    multiCtx.text = String(r.result || ''); multiCtx.filename = f.name || '';
    multiCtx.plan = null; multiCtx.error = null;
    renderMultiBody();
    parseMultiImport();
  };
  r.onerror = () => toast('文件读取失败');
  r.readAsText(f, 'utf-8');
}
/* several files at once → merged into one chapters[] payload */
function handleMultiFiles(ev) {
  const files = Array.from(ev.target.files || []);
  if (!files.length) return;
  ev.target.value = '';
  if (!multiCtx) return;
  const b = getBook(multiCtx.bookId), co = getCourse(multiCtx.courseId);
  const merged = { format: 'politics-quiz-import', version: '1.0', book: b ? b.name : '', course: co ? courseTitle(co) : '', chapters: [] };
  let done = 0, failed = [];
  files.forEach(f => {
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(sanitizeJSON(String(r.result || '')));
        const chs = Array.isArray(d.chapters) ? d.chapters
          : (Array.isArray(d.questions) && d.chapter ? [{ name: String(d.chapter), questions: d.questions }] : null);
        if (!chs) throw new Error('没有 chapters');
        chs.forEach(c => merged.chapters.push(c));
      } catch (e) { failed.push(f.name); }
      done++;
      if (done === files.length) {
        multiCtx.text = JSON.stringify(merged, null, 2);
        multiCtx.filename = files.length + ' 个文件';
        multiCtx.plan = null; multiCtx.error = null;
        renderMultiBody();
        parseMultiImport();
        if (failed.length) toast('有 ' + failed.length + ' 个文件无法解析：' + failed.join('、'), 4000);
      }
    };
    r.onerror = () => { failed.push(f.name); done++; };
    r.readAsText(f, 'utf-8');
  });
}

/* ================================================================
   BACKUP (whole politics library → one .json file)
   Export: { app, kind:'politics-backup', version, schemaVersion, exportedAt,
             counts, books, chapters, questions, answerLog, wrongBook,
             createdAt, updatedAt }
   Import: strict validation of the same shape (also accepts the older
           { app, exportedAt, ...S } files and a raw state object); the current
           data is replaced ONLY after the whole file passed validation AND the
           user confirmed. A failed import never touches existing data.
   Namespace: polquiz_v1* only — never writes into the English Quiz Hub keys.
   ================================================================ */
function buildFullBackupPayload() {
  return {
    app: 'politics-quiz-hub',
    kind: 'politics-backup',
    version: '1.0',
    schemaVersion: SCHEMA,
    exportedAt: new Date().toISOString(),
    counts: {
      books: S.books.length, courses: S.courses.length, chapters: S.chapters.length, questions: S.questions.length,
      answerLog: Object.keys(S.answerLog || {}).length, wrongBook: S.wrongBook.length, due: dueItems().length
    },
    books: cloneData(S.books),
    courses: cloneData(S.courses),
    chapters: cloneData(S.chapters),
    questions: cloneData(S.questions),
    answerLog: cloneData(S.answerLog),
    wrongBook: cloneData(S.wrongBook),
    createdAt: S.createdAt || null,
    updatedAt: S.updatedAt || null
  };
}

    const msg = '用这个备份替换当前政治题库的全部数据？\n\n'

    if (!confirm(msg)) { say('已取消导入，当前数据未被修改。'); toast('已取消备份导入', 2600); return; }
    /* ---- commit: replace the whole state in one shot ---- */

    saveUI(); rv = null; cardState = {}; importTarget = null;
    render();

  const finish = () => { _refreshing = false; if (btn) { btn.classList.remove('spinning'); btn.disabled = false; } };
  const sleep = ms => new Promise(r => setTimeout(r, ms));

    /* 2. local files have no deployed version to fetch */

    }
    if (navigator.onLine === false) { toast('当前离线，无法检查更新。已继续使用现有版本。', 3600); finish(); return; }
    /* 3. fetch newest HTML, bypassing and rewriting the HTTP cache entry */

    if (!/id=["']mainContent["']/.test(html)) { toast('返回的内容不是本应用页面（可能被网络拦截），已取消更新。', 4200); finish(); return; }
    const m = html.match(/<meta\s+name=["']app-version["']\s+content=["']([^"']*)["']/i);
    const latest = m ? m[1] : null;
    if (latest && latest !== APP_VERSION) toast('发现新版本 ' + latest + '（当前 ' + APP_VERSION + '），正在更新…', 1800);
    else toast('当前已是最新版本（' + APP_VERSION + '），正在重新加载…', 1500);
    await sleep(500);
    /* 4. unique URL → guaranteed network fetch of the newest HTML */
    location.replace(base + '?_pqh_r=' + Date.now());

    const name = e && e.name, msg = (e && e.message) || '';

  const b = getBook(bd.bookId); if (!b) { toast('书籍不存在'); return; }
  const valid = chaptersOfCourse(b.id, bd.courseId);
  const picked = valid.filter(c => bd.sel.has(c.id));       // only chapters of the current course
  if (!picked.length) { toast('没有可删除的章节'); return; }
  const idSet = new Set(picked.map(c => c.id));
  const qIds = new Set(S.questions.filter(q => idSet.has(q.chapterId)).map(q => q.id));
  let mode = 'none', target = null;
  if (qIds.size > 0) {
    const mv = document.getElementById('bdModeMove'), dl = document.getElementById('bdModeDel');
    if (mv && mv.checked) {
      mode = 'move';
      const tid = (document.getElementById('bdTarget') || {}).value;
      target = valid.find(c => c.id === tid && !idSet.has(c.id)) || null;
      if (!target) { toast('请选择有效的目标章节'); return; }
    } else if (dl && dl.checked) mode = 'delete';
    else { toast('请先选择题目的处理方式'); return; }
  }
  batchDelBusy = true;
  const btn = document.querySelector('#genericSheetFoot .primary'); if (btn) btn.disabled = true;
  const snap = JSON.stringify({ chapters: S.chapters, questions: S.questions, answerLog: S.answerLog, wrongBook: S.wrongBook });
  const restore = () => { const o = JSON.parse(snap); S.chapters = o.chapters; S.questions = o.questions; S.answerLog = o.answerLog; S.wrongBook = o.wrongBook; };
  try {
    let moved = 0, removed = 0;
    if (mode === 'move') {
      S.questions.forEach(q => { if (idSet.has(q.chapterId)) { q.chapterId = target.id; moved++; } });
      S.wrongBook.forEach(w => { if (qIds.has(w.qId)) w.chapterId = target.id; });
    } else if (mode === 'delete') {
      removed = removeQuestionsWhere(q => idSet.has(q.chapterId));
    }
    S.chapters = S.chapters.filter(c => !idSet.has(c.id));
    if (UI.chapterId && idSet.has(UI.chapterId)) UI.chapterId = null;
    save();
    if (localStorage.getItem(STORE_KEY) !== JSON.stringify(S)) throw new Error('保存到本地存储失败');
    batchDel = null;
    closeSheet('genericSheet');
    render(); saveUI();
    toast('已删除 ' + picked.length + ' 个章节' + (moved ? '，' + moved + ' 道题已转移到「' + target.name + '」' : '') + (removed ? '，同时删除 ' + removed + ' 道题' : ''), 3600);
  } catch (e) {
    restore();
    try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (_) {}
    toast('删除失败：' + (e && e.message ? e.message : e) + '。原有数据已保留。', 4200);
    if (btn) btn.disabled = false;
  } finally { batchDelBusy = false; }
}

let lastRenderDate = todayISO();
function init() {
  loadState();
  lastIsMobile = isMobileViewport();
  if (lastIsMobile) sidebarCollapsed = true;
  else { let p = null; try { p = JSON.parse(localStorage.getItem(SIDEBAR_KEY)); } catch (e) {} sidebarCollapsed = p === null ? false : !!p; }
  applySidebar();
  const app = document.getElementById('app');
  app.addEventListener('click', e => { if (e.target === app && isMobileViewport() && !sidebarCollapsed) { sidebarCollapsed = true; applySidebar(); } });
  window.addEventListener('resize', onResize);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && todayISO() !== lastRenderDate) { lastRenderDate = todayISO(); render(); }
  });
  render();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
}
init();
