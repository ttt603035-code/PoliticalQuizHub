<!DOCTYPE html>

<title>Politics Quiz Hub</title>
<style>
/* ===== Base / layout / components: extracted verbatim from index 二 (Quiz Hub) ===== */
:root {
  --bg: #FFFFFF;

  --green: #1D1D1F;
  --red: #555555;
  --orange: #666666;
  --yellow: #888888;
  --purple: #555555;
  --pink: #555555;
  --teal: #555555;

  --english-tint: rgba(0,0,0,0.04);
  --chinese: #444444;
  --chinese-tint: rgba(0,0,0,0.03);
  --politic: #888888;

  --radius: 12px;

  --shadow: 0 1px 4px rgba(0,0,0,0.06);

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {

}

   Politics Quiz Hub — core: constants, storage, helpers, validation
   Namespace: polquiz_v1* (never touches eng_dashboard_* of the English Quiz Hub)
   ================================================================ */
const STORE_KEY   = 'polquiz_v1';
const BACKUP_KEY  = 'polquiz_v1_backup';
const UI_KEY      = 'polquiz_v1_ui';
const SIDEBAR_KEY = 'polquiz_v1_sidebar_collapsed';
const SCHEMA      = 1;
// Same Ebbinghaus ladder as the original Quiz Hub wrong book (EBINGHAUS_INTERVALS)
const INTERVALS   = [1, 3, 7, 15, 30, 60];

const TYPE_LABEL = { single:'单选题', multi:'多选题', debate:'辨析题', short:'简答题', material:'材料分析题', essay:'论述题' };
const TYPE_ALIAS = {
  single:'single', singlechoice:'single', radio:'single', '单选':'single', '单选题':'single', '单项选择':'single', '单项选择题':'single',
  multi:'multi', multiple:'multi', multichoice:'multi', multiplechoice:'multi', '多选':'multi', '多选题':'multi', '多项选择':'multi', '多项选择题':'multi',
  debate:'debate', '辨析':'debate', '辨析题':'debate',
  short:'short', shortanswer:'short', '简答':'short', '简答题':'short',
  material:'material', materialanalysis:'material', '材料分析':'material', '材料分析题':'material', '材料题':'material',
  essay:'essay', discussion:'essay', '论述':'essay', '论述题':'essay'
};
const isObjective = t => t === 'single' || t === 'multi';
const LETTERS = 'ABCDEFGH';

/* ---------- small helpers (same behaviour as the original) ---------- */
function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function uid(prefix) { return (prefix || 'id') + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7); }
function toast(msg, ms) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), ms || 1800);
}
/* LOCAL calendar date. (The original used toISOString() = UTC date, which is off by a day for
   several hours each morning in UTC+8 — that would break "review tomorrow".) */
function localISO(d) {
  d = d || new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function todayISO() { return localISO(new Date()); }
function addDaysISO(n) { const d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() + n); return localISO(d); }
function daysUntil(iso) {
  if (!iso) return 0;
  const a = new Date(todayISO() + 'T12:00:00'), b = new Date(iso + 'T12:00:00');
  return Math.round((b - a) / 86400000);
}
function fmtNext(iso) {
  if (!iso) return '';
  const n = daysUntil(iso);
  if (n <= 0) return '今天';
  if (n === 1) return '明天';
  const p = iso.split('-');
  return parseInt(p[1], 10) + '月' + parseInt(p[2], 10) + '日';
}
/* ---------- FILE SAVE (JSON → device file; Safari / iOS safe) ----------
   Rules:
   · the object URL and the temporary <a> are kept alive (60s) — mobile Safari aborts
     the download if either is revoked/removed right after the click;
   · where the browser supports it, the File System Access API is used, because it
     reports whether the file was really written;
   · iPhone / iPad always get an explicit manual "open → Share → Save to Files"
     sheet instead of a bare "已导出" toast, because the automatic download is
     unreliable there (especially in "added to Home Screen" mode).            */
const PENDING_URLS = [];
let lastExport = null;
function extOf(name) { const m = String(name || '').match(/\.([A-Za-z0-9]+)\s*$/); return (m ? m[1] : 'json').toLowerCase(); }
function isAppleMobile() {
  const ua = navigator.userAgent || '';
  if (/iPad|iPhone|iPod/.test(ua)) return true;
  return navigator.platform === 'MacIntel' && (navigator.maxTouchPoints || 0) > 1;   // iPadOS 13+ reports MacIntel
}
function isStandaloneApp() {
  try { if (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) return true; } catch (e) {}
  return navigator.standalone === true;
}
function keepURLAlive(url) {
  PENDING_URLS.push(url);
  setTimeout(() => {                       // revoked much later, never synchronously
    const i = PENDING_URLS.indexOf(url);
    if (i >= 0) PENDING_URLS.splice(i, 1);
    try { URL.revokeObjectURL(url); } catch (e) {}
  }, 60000);
}
function humanSize(n) {
  n = Number(n) || 0;
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1048576).toFixed(2) + ' MB';
}
function setStatusHTML(id, html) { const el = id && document.getElementById(id); if (el) el.innerHTML = html; }
function saveJSONFile(obj, filename, opts) {
  opts = opts || {};
  let text;
  try { text = JSON.stringify(obj, null, 2); } catch (e) { toast('导出失败：' + e.message, 3500); return null; }
  const blob = new Blob([text], { type: 'application/json;charset=utf-8' });
  lastExport = { filename: filename, text: text, blob: blob, size: blob.size, at: Date.now(), url: '' };
  saveBlobFile(blob, filename, opts);
  return lastExport;
}
function saveBlobFile(blob, filename, opts) {
  opts = opts || {};
  const statusId = opts.statusId || '';
  const say = html => setStatusHTML(statusId, html);
  /* 1) Desktop Chromium / Edge: real save dialog → real "saved" confirmation */
  if (!opts.noPicker && !isAppleMobile() && typeof window.showSaveFilePicker === 'function') {
    let picking = null;
    try {
      picking = window.showSaveFilePicker({
        suggestedName: filename,
        types: [{ description: 'JSON 文件', accept: { 'application/json': ['.' + extOf(filename)] } }]
      });
    } catch (e) { picking = null; }
    if (picking && typeof picking.then === 'function') {
      picking.then(async (handle) => {
        try {
          const w = await handle.createWritable();
          await w.write(blob);
          await w.close();
          toast('已保存：' + filename, 3200);
          say('✅ 已保存到本地文件：<b>' + esc(filename) + '</b>（' + humanSize(blob.size) + '）');
        } catch (err) { anchorDownload(blob, filename, say, opts); }
      }).catch((err) => {
        const nm = err && err.name;
        if (nm === 'AbortError') { toast('已取消保存', 2600); say('已取消保存。可以再点一次导出。'); return; }
        anchorDownload(blob, filename, say, opts);    // NotAllowedError / not supported → normal download
      });
      return;
    }
  }
  anchorDownload(blob, filename, say, opts);
}
function anchorDownload(blob, filename, say, opts) {
  say = say || function () {};
  opts = opts || {};
  let url = '';
  try { if (window.URL && URL.createObjectURL) url = URL.createObjectURL(blob); } catch (e) { url = ''; }
  if (url) {
    if (lastExport) lastExport.url = url;     // reused by the manual-save sheet
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.rel = 'noopener';
    a.style.cssText = 'position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0;pointer-events:none;';
    document.body.appendChild(a);
    let fired = false;
    try { a.click(); fired = true; }
    catch (e) {
      try { fired = a.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, view: window })); }
      catch (e2) { fired = false; }
    }
    keepURLAlive(url);                                       // keep the URL alive while the file is written
    setTimeout(() => { try { if (a.parentNode) a.parentNode.removeChild(a); } catch (e) {} }, 60000);
    if (isAppleMobile()) {
      if (opts.noFallback) {
        say('已生成文件：<b>' + esc(filename) + '</b>（' + humanSize(blob.size) + '）。');
        toast('已生成文件：' + filename, 3200);
        return;
      }
      say('已生成文件：<b>' + esc(filename) + '</b>（' + humanSize(blob.size) + '）。iPhone / iPad 若没有出现下载提示，请用弹出的窗口保存。');
      openSaveFallbackSheet(filename, isStandaloneApp() ? 'ios-standalone' : 'ios');
      return;
    }
    if (fired) {
      toast('已开始下载：' + filename, 3200);
      say('✅ 已触发下载：<b>' + esc(filename) + '</b>（' + humanSize(blob.size) + '）。如果浏览器没有出现下载文件，点「保存遇到问题？」用备用方式保存。');
      return;
    }
  }
  say('这个浏览器没能自动下载文件，请用下面的备用方式保存。' + (filename ? '（' + esc(filename) + '）' : ''));
  if (opts.noFallback) { toast('浏览器没能自动下载，请重试或改用 Backup 导出备份', 3600); return; }
  openSaveFallbackSheet(filename, 'blocked');
}
/* Manual save: shows the file as a tappable link + the raw JSON, always available. */
function openSaveFallbackSheet(filename, reason) {
  const le = lastExport;
  if (!le) { toast('还没有可保存的文件，请先点一次导出'); return; }
  const name = filename || le.filename;
  /* a fresh object URL every time the sheet opens, so a previously revoked URL can't
     leave a dead link; kept alive for the whole (long) moment the user needs it. */
  let href = '';
  try {
    if (le.blob) { href = URL.createObjectURL(le.blob); keepURLAlive(href); }
  } catch (e) { href = ''; }
  if (!href) { try { href = 'data:application/json;charset=utf-8,' + encodeURIComponent(le.text); } catch (e) { href = ''; } }
  const tip = (reason === 'ios-standalone')
    ? '这次可能是在「添加到主屏幕」的独立窗口里打开的，独立模式下浏览器常会拦截下载。请点下面的按钮打开文件，再用右上角「分享」→「存储到文件」。'
    : (reason === 'ios'
      ? '点下面的按钮打开文件，然后用右上角「分享」→「存储到文件」（或「下载」）保存到「文件」App。'
      : '如果浏览器拦截了自动下载，点下面的按钮手动保存，或复制 JSON 内容自行保存成 .json 文件。');
  openGenericSheet('保存 JSON 文件 — ' + name, `
    <div style="display:flex;flex-direction:column;gap:12px;">
      <div style="padding:12px 14px;background:var(--bg-elev);border:1px solid var(--line);border-radius:var(--radius);font-size:12px;color:var(--ink-secondary);line-height:1.7;">
        文件已生成：<b>${esc(name)}</b> · ${humanSize(le.size)}<br>${esc(tip)}
      </div>
      ${href ? `<a class="apple-btn primary" href="${esc(href)}" download="${esc(name)}" target="_blank" rel="noopener" style="display:block;text-align:center;text-decoration:none;padding:10px 14px;">打开 / 保存 ${esc(name)}</a>` : ''}
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="apple-btn small" onclick="toggleExportText()">显示 JSON 内容</button>
        <button class="apple-btn small" onclick="copyExportText()">复制 JSON</button>
      </div>
      <textarea id="polExportTextArea" class="ai-studio-import-textarea" style="display:none;min-height:180px;" readonly></textarea>
      <div class="bar-sub">备用方式：点「显示 JSON 内容」→ 全选复制 → 粘贴进备忘录 / 邮件 / 文本编辑器，保存成 .json 文件即可。</div>
    </div>`, [{ text: 'Close', cls: 'primary', onclick: () => closeSheet('genericSheet') }]);
}
function toggleExportText() {
  const ta = document.getElementById('polExportTextArea');
  if (!ta || !lastExport) return;
  if (ta.style.display === 'none') { ta.value = lastExport.text; ta.style.display = 'block'; ta.focus(); ta.select(); }
  else { ta.style.display = 'none'; }
}
function copyExportText() {
  if (!lastExport) { toast('还没有可复制的文件'); return; }
  copyText(lastExport.text, '已复制 JSON，可粘贴保存为 .json 文件');
}
function downloadJSON(obj, filename) { return saveJSONFile(obj, filename, {}); }
function downloadText(text, filename) {
  /* used by the AI prompt download inside the chapter sheet — it must not replace
     that sheet with the manual-save sheet on iPhone / iPad. */
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  lastExport = { filename: filename, text: String(text), blob: blob, size: blob.size, at: Date.now(), url: '' };
  saveBlobFile(blob, filename, { noFallback: true });
}
function safeName(s) { return String(s || '').replace(/[^\w\u4e00-\u9fff-]+/g, '_').slice(0, 40) || 'x'; }

/* ---------- dialogs (miniPrompt / sheet: same as the original) ---------- */
function miniPrompt(label, defaultVal, callback) {
  const overlay = document.getElementById('miniDialog');
  const lbl = document.getElementById('miniDialogLabel');
  const inp = document.getElementById('miniDialogInput');
  const ok = document.getElementById('miniDialogOk');
  const cancel = document.getElementById('miniDialogCancel');
  lbl.textContent = label; inp.value = defaultVal || '';
  overlay.classList.add('open'); inp.focus(); inp.select();
  const close = (result) => {
    overlay.classList.remove('open');
    ok.onclick = null; cancel.onclick = null; overlay.onclick = null; inp.onkeydown = null;
    callback(result);
  };
  ok.onclick = () => close(inp.value);
  cancel.onclick = () => close(null);
  overlay.onclick = (e) => { if (e.target === overlay) close(null); };
  inp.onkeydown = (e) => { if (e.key === 'Enter') close(inp.value); if (e.key === 'Escape') close(null); };
}
function openSheet(id) { document.getElementById(id).classList.add('open'); }
function closeSheet(id) { document.getElementById(id).classList.remove('open'); }
function openGenericSheet(title, bodyHTML, buttons) {
  document.getElementById('genericSheetTitle').textContent = title;
  document.getElementById('genericSheetBody').innerHTML = bodyHTML;
  const foot = document.getElementById('genericSheetFoot');
  foot.innerHTML = '';
  (buttons || []).forEach(b => {
    const btn = document.createElement('button');
    btn.className = 'apple-btn' + (b.cls ? ' ' + b.cls : '');
    btn.textContent = b.text; btn.onclick = b.onclick;
    foot.appendChild(btn);
  });
  openSheet('genericSheet');
}
document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.sheet-overlay').forEach(ov => {
    ov.addEventListener('click', e => { if (e.target === ov) closeSheet(ov.id); });
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet('genericSheet'); });
});

/* ================================================================
   STATE  (one JSON document → easy to sync across devices later)
   books[]      {id,name,createdAt}
   chapters[]   {id,bookId,name,createdAt}
   questions[]  {id,bookId,chapterId,type,question,options,answer,explanation,material,subQuestions,createdAt}
   answerLog    { [questionId]: {correct,chosen,text,subTexts,ts} }       (correct:null = subjective, not self-rated yet)
   wrongBook[]  {id,qId,bookId,chapterId, yourAnswer, completed, reviewStage,nextReviewDate,lastReviewDate,reviewCount,mastered,consecutiveCorrect, ts}
   ================================================================ */
function freshState() {
  return { schemaVersion: SCHEMA, books: [], chapters: [], questions: [], answerLog: {}, wrongBook: [], createdAt: Date.now(), updatedAt: Date.now() };
}
let S = freshState();
let UI = { view: 'home', bookId: null, chapterId: null, reviewBookId: 'all' };
let cardState = {};   // transient per-card UI state (selection, typed text, retry...)
let rv = null;        // current review session

function migrateState(d) {
  const s = freshState();
  if (!d || typeof d !== 'object') return s;
  s.books = Array.isArray(d.books) ? d.books : [];
  s.chapters = Array.isArray(d.chapters) ? d.chapters : [];
  s.questions = Array.isArray(d.questions) ? d.questions : [];
  s.answerLog = (d.answerLog && typeof d.answerLog === 'object') ? d.answerLog : {};
  s.wrongBook = Array.isArray(d.wrongBook) ? d.wrongBook : [];
  s.createdAt = d.createdAt || Date.now();
  s.updatedAt = d.updatedAt || Date.now();
  return s;
}
function cleanOrphans() {
  const bookIds = new Set(S.books.map(b => b.id));
  S.chapters = S.chapters.filter(c => bookIds.has(c.bookId));
  const chIds = new Set(S.chapters.map(c => c.id));
  S.questions = S.questions.filter(q => chIds.has(q.chapterId));
  const qIds = new Set(S.questions.map(q => q.id));
  S.wrongBook = S.wrongBook.filter(w => qIds.has(w.qId));
  Object.keys(S.answerLog).forEach(k => { if (!qIds.has(k)) delete S.answerLog[k]; });
}
function loadState() {
  let data = null, raw = null;
  try { raw = localStorage.getItem(STORE_KEY); } catch (e) {}
  if (raw) { try { data = JSON.parse(raw); } catch (e) { data = null; } }
  if (!data) {
    try {
      const b = localStorage.getItem(BACKUP_KEY);
      if (b) { data = JSON.parse(b); setTimeout(() => toast('主数据读取失败，已从自动备份恢复', 3000), 300); }
    } catch (e) {}
  }
  if (data) S = migrateState(data);
  try { const u = JSON.parse(localStorage.getItem(UI_KEY) || 'null'); if (u && typeof u === 'object') UI = Object.assign(UI, u); } catch (e) {}
  cleanOrphans();
  sanitizeUI();
}
function save() {
  S.updatedAt = Date.now();
  try {
    const json = JSON.stringify(S);
    localStorage.setItem(STORE_KEY, json);
    try { localStorage.setItem(BACKUP_KEY, json); } catch (_) {}
  } catch (e) { toast('保存失败：' + e.message + '（请先导出备份）', 4000); }
}
function saveUI() { try { localStorage.setItem(UI_KEY, JSON.stringify(UI)); } catch (e) {} }
function sanitizeUI() {
  const book = S.books.find(b => b.id === UI.bookId);
  const ch = S.chapters.find(c => c.id === UI.chapterId);
  if (UI.view === 'chapter') {
    if (!ch) UI.view = book ? 'book' : 'home';
    else UI.bookId = ch.bookId;
  }
  if (UI.view === 'book' && !book) UI.view = 'home';
  if (UI.reviewBookId !== 'all' && !S.books.find(b => b.id === UI.reviewBookId)) UI.reviewBookId = 'all';
  if (UI.view === 'review' && !rv) { /* list view, fine */ }
}

/* ---------- lookups ---------- */
const getBook = id => S.books.find(b => b.id === id) || null;
const getChapter = id => S.chapters.find(c => c.id === id) || null;
const getQ = id => S.questions.find(q => q.id === id) || null;
const chaptersOf = bid => S.chapters.filter(c => c.bookId === bid);
const questionsOfChapter = cid => S.questions.filter(q => q.chapterId === cid);
const questionsOfBook = bid => S.questions.filter(q => q.bookId === bid);
function wrongMap() { const m = {}; S.wrongBook.forEach(w => { m[w.qId] = w; }); return m; }
const isDone = w => !!(w.mastered || w.completed);
function isDueItem(w, today) { return !isDone(w) && (!w.nextReviewDate || w.nextReviewDate <= (today || todayISO())); }
function dueItems(scope) {
  const today = todayISO();
  return S.wrongBook.filter(w => {
    if (!getQ(w.qId) || !isDueItem(w, today)) return false;
    if (scope && scope.bookId && w.bookId !== scope.bookId) return false;
    if (scope && scope.chapterId && w.chapterId !== scope.chapterId) return false;
    return true;
  });
}
function statsFor(qs) {
  const wm = wrongMap(), today = todayISO();
  let answered = 0, newC = 0, due = 0;
  qs.forEach(q => {
    const log = S.answerLog[q.id], w = wm[q.id];
    if (log) answered++;
    if (w && isDueItem(w, today)) due++;
    if (!log && !w) newC++;
  });
  return { total: qs.length, answered, newC, due, pct: qs.length ? Math.round(answered / qs.length * 100) : 0 };
}
function qStatus(q, wm, today) {
  const w = wm[q.id];
  if (w && !isDone(w)) return isDueItem(w, today) ? { key: 'due', label: '待复习' } : { key: 'sched', label: '错题 · ' + fmtNext(w.nextReviewDate) + '复习' };
  if (w && isDone(w)) return { key: 'mastered', label: '已掌握' };
  if (S.answerLog[q.id]) return { key: 'done', label: '已做' };
  return { key: 'new', label: '新题' };
}

/* ================================================================
   IMPORT VALIDATION
   ================================================================ */
function sanitizeJSON(raw) {   // based on the original Quiz Hub cleaner, but safe for Chinese text:
  // curly quotes INSIDE strings (e.g. “两个结合”) and commas inside strings are left untouched.
  let s = String(raw || '').trim();
  s = s.replace(/^\uFEFF/, '').trim();
  const fenced = s.match(/```(?:json|JSON)?\s*([\s\S]*?)```/);
  if (fenced && fenced[1]) s = fenced[1].trim();
  s = s.replace(/^\s*json\s*[\r\n]+/i, '').trim();
  const objStart = s.indexOf('{'), arrStart = s.indexOf('[');
  let start = -1;
  if (objStart >= 0 && arrStart >= 0) start = Math.min(objStart, arrStart); else start = Math.max(objStart, arrStart);
  if (start < 0) return s;
  s = s.slice(start);
  const first = s[0], endChar = first === '[' ? ']' : (first === '{' ? '}' : '');
  if (endChar) {
    let depth = 0, inStr = false, bs = false, end = -1;
    for (let i = 0; i < s.length; i++) {
      const ch = s[i];
      if (bs) { bs = false; continue; }
      if (ch === '\\') { bs = true; continue; }
      if (ch === '"') { inStr = !inStr; continue; }
      if (inStr) continue;
      if (ch === first) depth++;
      else if (ch === endChar) { depth--; if (depth === 0) { end = i; break; } }
    }
    if (end >= 0) s = s.slice(0, end + 1);
  }
  let res = '', inS = false, bs2 = false;
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (inS) {
      if (bs2) { bs2 = false; res += c; continue; }
      if (c === '\\') { bs2 = true; res += c; continue; }
      if (c === '"') { inS = false; res += c; continue; }
      if (c === '\r') { if (s[i + 1] !== '\n') res += '\\n'; continue; }
      if (c === '\n') { res += '\\n'; continue; }
      if (c === '\t') { res += '\\t'; continue; }
      if (c.charCodeAt(0) < 32) { res += ' '; continue; }
      res += c; continue;
    }
    if (c === '"') { inS = true; res += c; continue; }
    if (c === ',') {                       // drop trailing commas (outside strings only)
      let j = i + 1;
      while (j < s.length && /\s/.test(s[j])) j++;
      if (s[j] === '}' || s[j] === ']') continue;
    }
    if (c === '\u00A0') { res += ' '; continue; }
    res += c;
  }
  return res;
}
function toText(v) {                 // string | string[] | number → trimmed string ('' if empty)
  if (v == null) return '';
  if (Array.isArray(v)) return v.map(x => String(x == null ? '' : x).trim()).filter(Boolean).join('\n');
  if (typeof v === 'string') return v.trim();
  if (typeof v === 'number' || typeof v === 'boolean') return String(v);
  return null;                       // object → invalid
}
function normalizeOptions(options, errs) {
  if (!Array.isArray(options)) { errs.push('缺少 options，或 options 不是数组'); return null; }
  if (options.length < 2 || options.length > 8) { errs.push('选项数量必须在 2–8 个之间（当前 ' + options.length + ' 个）'); return null; }
  const out = [];
  let ok = true;
  options.forEach((o, k) => {
    let t = toText(o);
    if (t) t = t.replace(/\s*\n\s*/g, ' ');
    if (t === null || t === '') { errs.push('第 ' + (k + 1) + ' 个选项为空或格式不对'); ok = false; return; }
    const expected = LETTERS[k];
    const m = t.match(/^\s*([A-Ha-h])\s*[\.．、\)）:：]\s*/);
    let body = t;
    if (m) {
      if (m[1].toUpperCase() !== expected) { errs.push('第 ' + (k + 1) + ' 个选项的字母前缀是 ' + m[1].toUpperCase() + '，但这个位置应该是 ' + expected); ok = false; return; }
      body = t.slice(m[0].length).trim();
    }
    if (!body) { errs.push('选项 ' + expected + ' 没有内容'); ok = false; return; }
    out.push(expected + '. ' + body);

}
function parseLetters(ans, n, errs) {

  if (!str) { errs.push('缺少 answer（标准答案）'); return null; }
  if (!/^[A-H]+$/.test(str)) { errs.push('answer ' + rawShown + ' 无法识别，应写成选项字母，例如 "A" 或 "ACD"'); return null; }
  const uniq = Array.from(new Set(str.split(''))).sort();
  const bad = uniq.filter(c => LETTERS.indexOf(c) >= n);
  if (bad.length) { errs.push('answer 中的 ' + bad.join('、') + ' 超出选项范围（共 ' + n + ' 个选项，A–' + LETTERS[n - 1] + '）'); return null; }
  return uniq;
}
/* returns {q, errors:[]}; q is null when errors exist */
function normalizeQuestion(raw) {
  const errs = [];

  const tkey = String(raw.type == null ? '' : raw.type).trim().toLowerCase().replace(/[\s_\-]+/g, '');
  if (!tkey) return { q: null, errors: ['缺少 type（可选：single / multi / debate / short / material / essay，或中文题型名）'] };
  const type = TYPE_ALIAS[tkey];
  if (!type) return { q: null, errors: ['无法识别的 type："' + raw.type + '"（可选：single 单选题 / multi 多选题 / debate 辨析题 / short 简答题 / material 材料分析题 / essay 论述题）'] };

  const q = { type, question: '', options: [], answer: '', explanation: '', material: '', subQuestions: [] };
  const stem = toText(raw.question != null ? raw.question : (raw.stem != null ? raw.stem : raw.title));
  if (stem === null) errs.push('question 格式不对（应为字符串）');
  q.question = stem || '';
  const exp = toText(raw.explanation != null ? raw.explanation : (raw.analysis != null ? raw.analysis : (raw.explain != null ? raw.explain : raw.reason)));
  if (exp === null) errs.push('explanation 格式不对（应为字符串或字符串数组）'); else q.explanation = exp || '';

  if (type !== 'material' && !q.question) errs.push('缺少 question（题干）');

  if (isObjective(type)) {
    const opts = normalizeOptions(raw.options, errs);
    if (opts) {
      q.options = opts;
      const letters = parseLetters(raw.answer, opts.length, errs);
      if (letters) {
        if (type === 'single' && letters.length !== 1) errs.push('单选题的 answer 只能有 1 个选项，当前是 ' + letters.join(''));
        if (type === 'multi' && letters.length < 2) errs.push('多选题的 answer 至少要有 2 个正确选项，当前是 ' + letters.join('') + '（如果只有 1 个正确答案，请把 type 改为 single）');
        q.answer = letters.join('');
      }
    }
  } else if (type === 'material') {
    const mat = toText(raw.material != null ? raw.material : (raw.passage != null ? raw.passage : raw.content));
    if (mat === null || !mat) errs.push('材料分析题缺少 material（材料正文）');
    else q.material = mat;
    const subs = raw.subQuestions != null ? raw.subQuestions : (raw.questions != null ? raw.questions : raw.subs);
    if (!Array.isArray(subs) || !subs.length) errs.push('材料分析题缺少 subQuestions（小题数组，至少 1 个）');
    else {
      subs.forEach((s, k) => {
        if (!s || typeof s !== 'object') { errs.push('小题 ' + (k + 1) + ' 不是对象'); return; }
        const sq = toText(s.question != null ? s.question : s.stem);
        const sa = toText(s.answer != null ? s.answer : (s.reference != null ? s.reference : s.referenceAnswer));
        if (!sq) errs.push('小题 ' + (k + 1) + ' 缺少 question');
        if (!sa) errs.push('小题 ' + (k + 1) + ' 缺少 answer（参考答案）');
        if (sq && sa) q.subQuestions.push({ question: sq, answer: sa });
      });
    }
  } else {  // debate / short / essay
    const ans = toText(raw.answer != null ? raw.answer : (raw.reference != null ? raw.reference : raw.referenceAnswer));
    if (ans === null) errs.push('answer 格式不对（应为字符串或字符串数组）');
    else if (!ans) errs.push('缺少 answer（' + TYPE_LABEL[type] + '需要参考答案）');

}
function jsonErrorHint(e, clean) {
  let msg = e && e.message ? e.message : String(e);
  const m = msg.match(/position (\d+)/);

    const p = parseInt(m[1], 10);
    const before = clean.slice(Math.max(0, p - 30), p), after = clean.slice(p, p + 30);
    const line = clean.slice(0, p).split('\n').length;

}
/* Full-batch validation: nothing is imported unless EVERY question passes. */
function validateImport(rawText) {
  const out = { ok: false, fatal: null, errors: [], questions: [], counts: {} };
  const raw = String(rawText || '').trim();
  if (!raw) { out.fatal = '还没有粘贴 JSON'; return out; }
  let data, clean = '';
  clean = sanitizeJSON(raw);
  try { data = JSON.parse(clean); }
  catch (e) {
    let ok2 = false;
    try { data = JSON.parse(clean.replace(/[\u201c\u201d]/g, '"')); ok2 = true; } catch (e2) {}   // JSON typed with curly quotes as delimiters
    if (!ok2) { out.fatal = 'JSON 格式错误：' + jsonErrorHint(e, clean) + '。常见原因：缺少逗号/引号、字符串里有未转义的英文双引号 "、多余的逗号。'; return out; }
  }
  let list;
  if (Array.isArray(data)) list = data;
  else if (data && Array.isArray(data.questions)) list = data.questions;
  else { out.fatal = '找不到题目数组：顶层应为 {"questions":[...]} 或直接是 [...]'; return out; }
  if (!list.length) { out.fatal = 'questions 是空数组，没有可导入的题目'; return out; }
  list.forEach((raw1, i) => {
    const r = normalizeQuestion(raw1);
    if (r.q) { out.questions.push(r.q); out.counts[r.q.type] = (out.counts[r.q.type] || 0) + 1; }
    else {
      const hint = raw1 && typeof raw1 === 'object' ? String(toText(raw1.question) || toText(raw1.material) || '').slice(0, 24) : '';
      r.errors.forEach(msg => out.errors.push({ index: i + 1, hint, msg }));
    }
  });
  out.total = list.length;
  out.ok = out.errors.length === 0;
  return out;
}
function exportQuestionObj(q) {
  const o = { type: q.type, question: q.question };
  if (q.type === 'material') { o.material = q.material; o.subQuestions = q.subQuestions.map(s => ({ question: s.question, answer: s.answer })); }
  else if (isObjective(q.type)) { o.options = q.options.slice(); o.answer = q.type === 'multi' ? q.answer.split('') : q.answer; }
  else o.answer = q.answer;
  if (q.explanation) o.explanation = q.explanation;
  return o;
}

/* ---------- Question card (shared by chapter practice and review) ---------- */
function getCS(qid) { return cardState[qid] || (cardState[qid] = {}); }

function renderQuestionCard(q, ctx) {
  const cs = getCS(q.id), mode = ctx.mode;
  let res = null;
  if (mode === 'practice') { const log = S.answerLog[q.id]; if (log && !cs.retry) res = log; }
  else if (cs.submitted) res = cs.result;
  const obj = isObjective(q.type);
  const chosenSet = new Set(res && res.chosen ? res.chosen.split('') : []);
  const sel = cs.sel ? cs.sel : new Set();
  const text = cs.text !== undefined ? cs.text : ((res && res.text) || '');
  const subTexts = cs.subTexts || (res && res.subTexts) || [];
  const revealed = !!cs.revealed;
  const showRef = !!res || revealed;

  let meta;
  if (mode === 'practice') {
    const st = qStatus(q, wrongMap(), todayISO());
    meta = `Q${ctx.num} · ${TYPE_LABEL[q.type]} · ${st.label}`;
  } else {
    const c = getChapter(q.chapterId), b = getBook(q.bookId);
    meta = `${TYPE_LABEL[q.type]} · ${esc(b ? b.name : '')} › ${esc(c ? c.name : '')}`;
  }
  let html = `<div class="q-card" data-qid="${q.id}"><div class="q-meta">${mode === 'practice' ? esc(meta) : meta}${q.type === 'multi' ? ' · 请选出所有正确选项' : ''}</div>`;

  if (q.type === 'material') html += `<div class="q-material">${esc(q.material)}</div>`;
  if (q.question) html += `<div class="q-text pre" style="font-size:15px;font-weight:600;color:var(--ink);margin-bottom:10px;line-height:1.7;">${esc(q.question)}</div>`;

  if (obj) {
    html += `<div class="q-options">`;
    q.options.forEach(opt => {
      const letter = opt[0];
      let cls = 'q-opt';
      if (res) { if (q.answer.indexOf(letter) >= 0) cls += ' correct'; else if (chosenSet.has(letter)) cls += ' wrong'; }
      else if (revealed && q.answer.indexOf(letter) >= 0) cls += ' correct';
      else if (sel.has(letter)) cls += ' selected';
      html += `<button class="${cls}" ${mode === 'review' && res ? 'disabled' : ''} onclick="pickOption('${q.id}','${letter}','${mode}')"><span class="pre">${esc(opt)}</span></button>`;
    });
    html += `</div>`;
    if (res) {
      html += `<div class="q-status ${res.correct ? 'ok' : 'err'}">${res.correct ? '✓ 回答正确' : '✗ 回答错误 · 正确答案：' + q.answer.split('').join('、')}</div>`;
    }
    if (showRef) {
      html += `<div class="q-explain show"><div class="q-explain-title">Explanation (答案解析):</div>${refText(q.explanation || '暂无解析')}</div>`;
    }
  } else if (q.type === 'material') {
    q.subQuestions.forEach((s, i) => {
      html += `<div class="q-subq"><div class="q-subq-text">${esc(s.question)}</div>
        <textarea class="q-input" placeholder="写下你的答案（可选）…" oninput="setSubText('${q.id}',${i},this.value)">${esc(subTexts[i] || '')}</textarea>
        ${showRef ? `<div class="q-explain show"><div class="q-explain-title">参考答案 (Reference Answer):</div>${refText(s.answer)}</div>` : ''}</div>`;
    });
    if (showRef && q.explanation) html += `<div class="q-explain show"><div class="q-explain-title">Explanation (答案解析):</div>${refText(q.explanation)}</div>`;
  } else {
    html += `<textarea class="q-input" placeholder="写下你的答案（可选）…" oninput="setText('${q.id}',this.value)">${esc(text)}</textarea>`;
    if (showRef) {
      html += `<div class="q-explain show"><div class="q-explain-title">参考答案 (Reference Answer):</div>${refText(q.answer)}</div>`;
      if (q.explanation) html += `<div class="q-explain show"><div class="q-explain-title">Explanation (答案解析):</div>${refText(q.explanation)}</div>`;
    }
  }

  // subjective: self-rating (no forced auto-grading)
  if (!obj && res) {
    const r = res.correct;
    const locked = mode === 'review' && r !== null && r !== undefined;
    html += `<div class="q-status ${r === true ? 'ok' : 'err'}">${r === true ? '✓ 自评：答对了' : (r === false ? '✗ 自评：没答好' : '已提交 · 请对照参考答案自评')}</div>
      <div class="q-actions" style="margin-bottom:10px;">
        <button class="${r === true ? 'on' : ''}" ${locked ? 'disabled' : ''} onclick="rateSubjective('${q.id}',true,'${mode}')">我答对了</button>
        <button class="${r === false ? 'on' : ''}" ${locked ? 'disabled' : ''} onclick="rateSubjective('${q.id}',false,'${mode}')">没答好</button>
      </div>`;
  }

  if (mode === 'review' && res && cs.reviewMsg) html += `<div class="bar-sub" style="margin-bottom:8px;">${esc(cs.reviewMsg)}</div>`;

  // actions
  if (mode === 'practice') {
    html += `<div class="q-actions">
      <button class="primary" onclick="submitAnswer('${q.id}')">Submit</button>
      <button onclick="showAnswer('${q.id}')">Show Answer</button>
      <button onclick="addToWrongBookQuick('${q.id}')" title="Add to Wrong Book" aria-label="Add to Wrong Book" style="font-size:16px;font-weight:800;">+</button>
      <button onclick="openQuestionEditor('${q.id}')">Edit</button>
      <button onclick="deleteQuestion('${q.id}')">Delete</button>
    </div>`;
  } else {
    const w = rv ? S.wrongBook.find(x => x.id === rv.ids[rv.idx]) : null;
    const answered = !!res && (obj || (res.correct !== null && res.correct !== undefined));
    if (!res) html += `<div class="q-actions"><button class="primary" onclick="submitAnswer('${q.id}')">Submit</button><button onclick="exitReviewSession()">Back to List</button></div>`;
    else html += `<div class="q-actions">
        ${answered && res.correct === true && w && !isDone(w) ? `<button onclick="masterCurrentReview()">Mark Mastered</button>` : ''}

        <button onclick="exitReviewSession()">Back to List</button>
      </div>`;
  }

}
function refreshCard(qid) {

function reviewScope() { return UI.reviewBookId && UI.reviewBookId !== 'all' ? { bookId: UI.reviewBookId } : null; }
function stageLabel(w) { return isDone(w) ? '已掌握' : (Math.min((w.reviewStage || 0) + 1, INTERVALS.length) + ' / ' + INTERVALS.length); }
function renderReview() {

  S.wrongBook = S.wrongBook.filter(w => !ids.has(w.qId));
  ids.forEach(id => { delete S.answerLog[id]; delete cardState[id]; });

}

/* ================================================================
   ANSWERING  (Submit → instant right/wrong → wrong answers recorded)
   ================================================================ */
function pickOption(qid, letter, mode) {
  const q = getQ(qid); if (!q) return;
  const cs = getCS(qid);
  if (mode === 'practice') {
    if (S.answerLog[qid] && !cs.retry) { cs.retry = true; cs.sel = new Set(); cs.revealed = false; }
  } else if (cs.submitted) return;
  if (!cs.sel) cs.sel = new Set();
  if (q.type === 'single') cs.sel = new Set([letter]);
  else { if (cs.sel.has(letter)) cs.sel.delete(letter); else cs.sel.add(letter); }
  if (mode === 'practice') refreshCard(qid); else render();
}
function setText(qid, v) { getCS(qid).text = v; }
function setSubText(qid, i, v) { const cs = getCS(qid); if (!cs.subTexts) { const log = S.answerLog[qid]; cs.subTexts = (log && log.subTexts ? log.subTexts.slice() : []); } cs.subTexts[i] = v; }

function upsertWrong(q, yourAnswer) {
  const w = S.wrongBook.find(x => x.qId === q.id);
  const fresh = {
    qId: q.id, bookId: q.bookId, chapterId: q.chapterId, yourAnswer: yourAnswer || '-', ts: Date.now(),
    completed: false, mastered: false, reviewStage: 0, nextReviewDate: addDaysISO(INTERVALS[0]),
    lastReviewDate: w ? w.lastReviewDate : null, reviewCount: w ? w.reviewCount : 0, consecutiveCorrect: 0
  };
  if (w) Object.assign(w, fresh); else S.wrongBook.push(Object.assign({ id: uid('wb') }, fresh));
}
function recordResult(q, correct, extra) {
  S.answerLog[q.id] = Object.assign({ correct, ts: Date.now() }, extra);
  if (correct === false) upsertWrong(q, extra.chosen || extra.text || '-');
  save();
}
function submitAnswer(qid) {
  const q = getQ(qid); if (!q) return;
  const cs = getCS(qid);
  const inReview = UI.view === 'review' && rv;
  if (isObjective(q.type)) {
    const chosen = Array.from(cs.sel || []).sort().join('');
    if (!chosen) { toast('请先选择答案'); return; }
    const correct = chosen === q.answer;
    if (inReview) { reviewResult(q, { correct, chosen }, correct); return; }
    recordResult(q, correct, { chosen });
    cs.retry = false; cs.revealed = false;
    refreshCard(qid);
    return;
  }
  // subjective types: no auto grading — show the reference answer and let me self-rate
  const log = S.answerLog[qid] || {};
  const text = cs.text !== undefined ? cs.text : (log.text || '');
  const subTexts = cs.subTexts || log.subTexts || [];
  if (inReview) { reviewResult(q, { correct: null, text, subTexts }, null); return; }
  S.answerLog[qid] = { correct: null, ts: Date.now(), text, subTexts };
  save();
  cs.retry = false; cs.revealed = false;
  refreshCard(qid);
}
function rateSubjective(qid, ok, mode) {
  const q = getQ(qid); if (!q) return;
  if (mode === 'review') { reviewRate(q, ok); return; }
  const log = S.answerLog[qid]; if (!log) return;
  log.correct = ok;
  if (ok === false) upsertWrong(q, log.text || (log.subTexts || []).join(' ') || '-');
  save(); refreshCard(qid);
}
function showAnswer(qid) {
  const cs = getCS(qid); cs.revealed = true; refreshCard(qid);
}
function addToWrongBookQuick(qid) {
  const q = getQ(qid); if (!q) return;
  const w = S.wrongBook.find(x => x.qId === qid);
  if (w && !isDone(w)) { toast('已在错题本中（' + fmtNext(w.nextReviewDate) + '复习）'); return; }
  upsertWrong(q, '-');
  save(); refreshCard(qid); toast('已加入错题本，明天复习');
}
function deleteQuestion(qid) {
  if (!confirm('Delete this question?')) return;
  S.questions = S.questions.filter(x => x.id !== qid);
  S.wrongBook = S.wrongBook.filter(w => w.qId !== qid);
  delete S.answerLog[qid]; delete cardState[qid];
  save(); render();
}
function redoCurrentChapter() {
  const c = getChapter(UI.chapterId); if (!c) return;
  const qs = questionsOfChapter(c.id);
  if (!qs.length) { toast('本章暂无题目'); return; }
  const answered = qs.filter(q => S.answerLog[q.id]).length;
  if (!confirm('确定要重新做一遍本章吗？\n将清空本章 ' + qs.length + ' 道题（已答 ' + answered + ' 题）的答题状态。错题本里的复习安排不会被清除。')) return;
  qs.forEach(q => { delete S.answerLog[q.id]; delete cardState[q.id]; });
  save(); render(); toast('已重置，可以重新练习本章 ↻');
}

  const c = getChapter(UI.chapterId); if (!c) return;

function fieldTA(label, id, val, rows) { return `<div class="field"><label>${label}</label><textarea id="${id}" rows="${rows || 3}">${esc(val || '')}</textarea></div>`; }
function subBlockHTML(s) {
  return `<div class="sub-block"><div class="field"><label>小题题干</label><textarea class="qe-sq" rows="2">${esc(s ? s.question : '')}</textarea></div>
    <div class="field"><label>参考答案</label><textarea class="qe-sa" rows="4">${esc(s ? s.answer : '')}</textarea></div>
    <button class="apple-btn small danger" onclick="this.closest('.sub-block').remove()">删除此小题</button></div>`;
}
function addSubBlock() { document.getElementById('qeSubs').insertAdjacentHTML('beforeend', subBlockHTML(null)); }
function openQuestionEditor(qid) {
  const q = getQ(qid); if (!q) return;
  const t = q.type;
  let body = `<div class="bar-sub" style="margin-bottom:12px;">题型：${TYPE_LABEL[t]}（题型不可修改）</div>`;
  if (t === 'material') body += fieldTA('材料正文', 'qeMaterial', q.material, 7);
  body += fieldTA(t === 'material' ? '总题干（可选）' : '题干', 'qeQuestion', q.question, 3);
  if (isObjective(t)) {
    body += fieldTA('选项（每行一个，字母前缀可省略）', 'qeOptions', q.options.join('\n'), 6);
    body += `<div class="field"><label>正确答案（例如 A 或 ACD）</label><input id="qeAnswer" value="${esc(q.answer)}"></div>`;
  } else if (t === 'material') {
    body += `<div id="qeSubs">${q.subQuestions.map(subBlockHTML).join('')}</div><button class="apple-btn small" style="margin-bottom:14px;" onclick="addSubBlock()">+ 小题</button>`;
  } else body += fieldTA('参考答案', 'qeAnswerText', q.answer, 7);
  body += fieldTA('解析（可选）', 'qeExplanation', q.explanation, 4);
  openGenericSheet('Edit Question', body, [
    { text: 'Cancel', onclick: () => closeSheet('genericSheet') },
    { text: 'Save', cls: 'primary', onclick: () => {
      const raw = { type: t, question: document.getElementById('qeQuestion').value, explanation: document.getElementById('qeExplanation').value };
      if (t === 'material') {
        raw.material = document.getElementById('qeMaterial').value;
        raw.subQuestions = Array.from(document.querySelectorAll('#qeSubs .sub-block')).map(b => ({ question: b.querySelector('.qe-sq').value, answer: b.querySelector('.qe-sa').value }));
      } else if (isObjective(t)) {
        raw.options = document.getElementById('qeOptions').value.split('\n').map(x => x.trim()).filter(Boolean);
        raw.answer = document.getElementById('qeAnswer').value;
      } else raw.answer = document.getElementById('qeAnswerText').value;
      const r = normalizeQuestion(raw);
      if (!r.q) { toast(r.errors[0], 3500); return; }
      Object.assign(q, r.q);
      save(); closeSheet('genericSheet'); render(); toast('已保存');
    } }
  ]);
}

/* ================================================================
   REVIEW  (wrong → tomorrow; correct → Ebbinghaus ladder; wrong again → tomorrow)
   ================================================================ */
function handleReview(w, ok) {
  w.lastReviewDate = todayISO(); w.lastReviewedAt = Date.now();
  w.reviewCount = (w.reviewCount || 0) + 1;
  let msg;
  if (ok) {
    w.consecutiveCorrect = (w.consecutiveCorrect || 0) + 1;
    w.reviewStage = (w.reviewStage || 0) + 1;
    if (w.reviewStage >= INTERVALS.length) {
      w.mastered = true; w.completed = true; w.nextReviewDate = null;
      msg = '答对了！已完成全部复习阶段，标记为已掌握。';
    } else {
      w.nextReviewDate = addDaysISO(INTERVALS[w.reviewStage]);
      msg = '答对了！下次复习：' + INTERVALS[w.reviewStage] + ' 天后（' + w.nextReviewDate + '）。';
    }
  } else {
    w.consecutiveCorrect = 0; w.reviewStage = 0; w.mastered = false; w.completed = false;
    w.nextReviewDate = addDaysISO(INTERVALS[0]);
    msg = '答错了，明天再复习一次（' + w.nextReviewDate + '）。';
  }
  save();
  return msg;
}
function curReviewItem() { return rv ? S.wrongBook.find(x => x.id === rv.ids[rv.idx]) : null; }
function startReview(scope) {
  const list = dueItems(scope);
  if (!list.length) { toast('今天没有待复习的题目'); return; }
  rv = { ids: list.map(w => w.id), idx: 0, results: [], scope: scope || null };
  UI.view = 'review'; saveUI(); cardState = {}; render();
  document.getElementById('mainContent').scrollTop = 0; collapseSidebarOnMobile();
}
function startReviewOne(id) {
  if (!S.wrongBook.find(w => w.id === id)) return;
  rv = { ids: [id], idx: 0, results: [], scope: null, single: true };
  cardState = {}; render(); document.getElementById('mainContent').scrollTop = 0;
}
function reviewResult(q, result, correctOrNull) {
  const w = curReviewItem(); if (!w) return;
  const cs = getCS(q.id);
  cs.submitted = true; cs.result = result;
  if (correctOrNull !== null) { cs.reviewMsg = handleReview(w, correctOrNull); rv.results[rv.idx] = correctOrNull; }
  render();
}
function reviewRate(q, ok) {
  const cs = getCS(q.id), w = curReviewItem();
  if (!w || !cs.result || (cs.result.correct !== null && cs.result.correct !== undefined)) return;
  cs.result.correct = ok;
  cs.reviewMsg = handleReview(w, ok); rv.results[rv.idx] = ok;
  render();
}
function nextReview() {
  if (!rv) return;
  rv.idx++; cardState = {}; render();
  document.getElementById('mainContent').scrollTop = 0;
}
function masterCurrentReview() {
  const w = curReviewItem(); if (!w) return;
  w.completed = true; w.mastered = true; w.reviewStage = INTERVALS.length; w.nextReviewDate = null; w.lastReviewDate = todayISO();
  save(); toast('已标记为已掌握'); nextReview();
}

/* ================================================================
   BOOK-LEVEL EXPORT / IMPORT   (one book at a time)

     { app, kind, version, schemaVersion, exportedAt,
       book:{id,name,createdAt},
       chapters:[{id,name,order,createdAt}],
       questions:[{id,chapterId,bookId,type,question,options,answer,

       answerLog:{ [questionId]: {…} },
       wrongBook:[ {id,qId,bookId,chapterId,…} ] }

     · every id is RE-MAPPED, so collisions with this device's ids can't corrupt data;
     · "merge into the current book" reuses chapters with the same name and skips
       questions whose text already exists in that chapter (no duplicates on re-import);
     · "as a new book" never overwrites an existing book with the same name;

function cloneData(v) { return v == null ? v : JSON.parse(JSON.stringify(v)); }
function buildBookPayload(bookId) {

  const qs = S.questions.filter(q => chIds[q.chapterId]);
  const qIds = {}; qs.forEach(q => { qIds[q.id] = true; });
  const answerLog = {};
  Object.keys(S.answerLog).forEach(k => { if (qIds[k]) answerLog[k] = cloneData(S.answerLog[k]); });
  const wrongBook = S.wrongBook.filter(w => qIds[w.qId]).map(cloneData);
  return {
    app: 'politics-quiz-hub',
    kind: 'politics-book',
    version: '1.0',

    chapters: chs.map((c, i) => ({ id: c.id, name: c.name, order: i, createdAt: c.createdAt || null })),
    questions: qs.map(q => ({
      id: q.id, chapterId: q.chapterId, bookId: q.bookId, type: q.type,
      question: q.question || '',
      options: Array.isArray(q.options) ? q.options.slice() : [],
      answer: q.answer == null ? '' : q.answer,

/* ---------- validation of a book file (returns a temp, validated payload) ---------- */
function normalizeBookPayload(data) {
  const out = { ok: false, error: null, warnings: [], bookName: '', chapters: [], questions: [], answerLog: {}, wrongBook: {} };
  if (!data || typeof data !== 'object' || Array.isArray(data)) { out.error = '文件顶层不是对象（应为本功能导出的书籍 JSON）'; return out; }
  if (data.passages || data.grammarQuestions || data.quizSets || data.roadmap) { out.error = '这是英语 Quiz Hub 的数据，不能导入到政治版'; return out; }
  if (data.kind === 'politics-backup' || (Array.isArray(data.books) && Array.isArray(data.chapters))) {
    out.error = '这是「全量备份」文件（包含整库数据）。请用侧边栏 Backup → Import Backup 恢复整库，而不是按单本书导入。';
    return out;
  }
  let bookName = '';
  let chSrc = null, qSrc = null, logSrc = null, wrongSrc = null;
  if (data.book && typeof data.book === 'object' && !Array.isArray(data.book)) {
    bookName = String(data.book.name == null ? '' : data.book.name).trim();
    chSrc = data.chapters; qSrc = data.questions; logSrc = data.answerLog; wrongSrc = data.wrongBook;
  } else if (typeof data.book === 'string' && Array.isArray(data.questions) && !Array.isArray(data.chapters)) {
    /* legacy single-chapter export: { book:'书名', chapter:'章节名', questions:[AI 题目…] } */
    bookName = String(data.book).trim();
    const chName = String(data.chapter == null ? '' : data.chapter).trim() || '导入的章节';
    chSrc = [{ id: '__legacy_ch_1', name: chName }];
    qSrc = data.questions.map(q => (q && typeof q === 'object') ? Object.assign({}, q, { chapterId: '__legacy_ch_1' }) : q);
  } else if (typeof data.bookName === 'string' && Array.isArray(data.questions)) {
    bookName = String(data.bookName).trim();
    chSrc = data.chapters; qSrc = data.questions; logSrc = data.answerLog; wrongSrc = data.wrongBook;
  } else {
    out.error = '找不到书籍信息：文件里没有 book / chapters / questions（只接受本功能导出的单本书文件）';
    return out;
  }
  if (!bookName) bookName = '导入的书籍';
  if (!Array.isArray(chSrc) || !chSrc.length) { out.error = '文件里没有章节（chapters 为空）'; return out; }
  if (!Array.isArray(qSrc) || !qSrc.length) { out.error = '文件里没有题目（questions 为空）'; return out; }

  const idMap = new Map(), usedIds = new Set();
  for (let i = 0; i < chSrc.length; i++) {
    const c = chSrc[i];
    if (!c || typeof c !== 'object') { out.warnings.push('第 ' + (i + 1) + ' 个章节不是对象，已跳过'); continue; }
    const name = String(c.name != null ? c.name : (c.title != null ? c.title : '')).trim();
    if (!name) { out.warnings.push('第 ' + (i + 1) + ' 个章节没有名称，已跳过'); continue; }
    let sid = c.id == null ? '' : String(c.id);
    if (!sid || usedIds.has(sid)) sid = '__ch_' + i + '_' + Math.random().toString(36).slice(2, 6);
    usedIds.add(sid);
    const rec = { srcId: sid, name: name, createdAt: c.createdAt || null };
    out.chapters.push(rec);
    idMap.set(sid, rec);
    if (c.id != null) idMap.set(String(c.id), rec);
  }
  if (!out.chapters.length) { out.error = '文件里没有可用的章节'; return out; }

  const qIdMap = new Map();
  for (let i = 0; i < qSrc.length; i++) {
    const raw = qSrc[i];
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) { out.error = '第 ' + (i + 1) + ' 道题不是对象'; return out; }
    const chRef = raw.chapterId != null ? raw.chapterId : (raw.chapterKey != null ? raw.chapterKey : raw.chapter);
    let ch = chRef == null ? null : idMap.get(String(chRef));
    if (!ch && raw.chapterName != null) ch = out.chapters.find(x => x.name === String(raw.chapterName).trim()) || null;
    if (!ch && out.chapters.length === 1) ch = out.chapters[0];        // tolerance for 1-chapter files
    if (!ch) { out.error = '第 ' + (i + 1) + ' 道题引用的章节在文件里不存在（' + (chRef == null ? '空' : String(chRef)) + '）'; return out; }
    const r = normalizeQuestion(raw);
    if (!r.q) { out.error = '第 ' + (i + 1) + ' 道题数据不完整：' + r.errors.slice(0, 3).join('；'); return out; }
    const sid = raw.id == null ? '' : String(raw.id);
    const rec = { srcId: sid, chSrcId: ch.srcId, q: r.q };
    out.questions.push(rec);
    if (sid && !qIdMap.has(sid)) qIdMap.set(sid, rec);
  }
  if (!out.questions.length) { out.error = '文件里没有可导入的题目'; return out; }

  if (logSrc && typeof logSrc === 'object' && !Array.isArray(logSrc)) {
    Object.keys(logSrc).forEach(k => {
      const rec = qIdMap.get(String(k)), v = logSrc[k];
      if (!rec || !v || typeof v !== 'object' || Array.isArray(v)) return;
      out.answerLog[String(k)] = cloneData(v);
    });
  }
  if (Array.isArray(wrongSrc)) {
    const seen = new Set();
    wrongSrc.forEach(w => {
      if (!w || typeof w !== 'object') return;
      const key = String(w.qId);
      if (!qIdMap.get(key) || seen.has(key)) return;
      seen.add(key);
      out.wrongBook[key] = cloneData(w);
    });
  }
  out.bookName = bookName;
  out.ok = true;
  return out;
}
/* ---------- merge / create (everything is prepared in temp arrays first) ---------- */
function questionSig(chapterNameKey, q) {
  const body = String(q.question || q.material || '').replace(/\s+/g, '').slice(0, 200);
  const ans = Array.isArray(q.answer) ? q.answer.join('') : String(q.answer == null ? '' : q.answer);
  return chapterNameKey + '|' + q.type + '|' + body + '|' + ans.replace(/\s+/g, '');
}
function applyBookImport(target, p, mode, newName) {
  const now = Date.now();
  const chIdMap = new Map();            // source chapter id -> chapter id on this device
  const qIdMap = new Map();             // source question id -> question id on this device
  const newChapters = [], newQuestions = [], newLogs = {}, newWrongs = [];
  let book = null;
  if (mode === 'new') {
    book = { id: uid('book'), name: newName, createdAt: now };
    p.chapters.forEach((ch, i) => {
      const id = uid('ch');
      chIdMap.set(ch.srcId, id);
      newChapters.push({ id: id, bookId: book.id, name: ch.name, createdAt: ch.createdAt || now + i });
    });
  } else {
    book = target;
    if (!book) throw new Error('目标书籍不存在');
    const existing = chaptersOf(book.id).slice();
    p.chapters.forEach((ch, i) => {
      const found = existing.find(c => c.name.trim().toLowerCase() === ch.name.trim().toLowerCase());
      if (found) { chIdMap.set(ch.srcId, found.id); return; }
      const id = uid('ch');
      chIdMap.set(ch.srcId, id);
      const rec = { id: id, bookId: book.id, name: ch.name, createdAt: ch.createdAt || now + i };
      newChapters.push(rec);
      existing.push(rec);
    });
  }
  /* duplicate protection (merge mode): signature of everything already in this book */
  const seenSig = new Set();
  const chNameById = {};
  chaptersOf(book.id).forEach(c => { chNameById[c.id] = c.name.trim().toLowerCase(); });
  if (mode === 'merge') {
    S.questions.forEach(q => { if (chNameById[q.chapterId]) seenSig.add(questionSig(chNameById[q.chapterId], q)); });
  }
  const chNameBySrc = {};
  p.chapters.forEach(c => { chNameBySrc[c.srcId] = c.name.trim().toLowerCase(); });
  const qChapterOf = {};               // new question id -> chapter id
  let skipped = 0;
  p.questions.forEach((rec, i) => {
    const chId = chIdMap.get(rec.chSrcId);
    if (!chId) { skipped++; return; }
    const chKey = chNameBySrc[rec.chSrcId] || '';
    if (mode === 'merge') {
      const sig = questionSig(chKey, rec.q);
      if (seenSig.has(sig)) { skipped++; return; }
      seenSig.add(sig);
    }
    const id = uid('q');
    if (rec.srcId) qIdMap.set(rec.srcId, id);

    const nid = qIdMap.get(String(k));

  });
  Object.keys(p.wrongBook).forEach(k => {
    const nid = qIdMap.get(String(k));
    if (!nid) return;
    const w = cloneData(p.wrongBook[k]);
    w.id = uid('wb');
    w.qId = nid;
    w.bookId = book.id;
    w.chapterId = qChapterOf[nid] || w.chapterId || null;
    newWrongs.push(w);

     the whole next state is built first; nothing is touched if anything threw. */
  const nextAnswerLog = Object.assign({}, S.answerLog);
  Object.keys(newLogs).forEach(k => { nextAnswerLog[k] = newLogs[k]; });
  S = Object.assign({}, S, {
    books: mode === 'new' ? S.books.concat([book]) : S.books.slice(),
    chapters: S.chapters.concat(newChapters),
    questions: S.questions.concat(newQuestions),
    answerLog: nextAnswerLog,
    wrongBook: S.wrongBook.concat(newWrongs)
  });
  save();
  render();
  return {
    book: book, isNew: mode === 'new', name: book.name,
    chapters: newChapters.length, reusedChapters: mode === 'merge' ? (p.chapters.length - newChapters.length) : 0,
    questions: newQuestions.length, skipped: skipped,
    logs: Object.keys(newLogs).length, wrongs: newWrongs.length

function handleBookFile(ev) {

  r.onload = () => {
    ev.target.value = '';
    if (!bookImportCtx) return;
    let data;
    try { data = JSON.parse(String(r.result || '').replace(/^\uFEFF/, '')); }
    catch (e) {
      bookImportCtx.parsed = null; bookImportCtx.filename = f.name || '';
      bookImportCtx.error = '文件不是有效的 JSON：' + (e && e.message ? e.message : e) + '。当前数据未被修改。';
      renderBookImportBody(); toast('文件无法解析，未导入任何内容', 3200); return;

function questionShapeError(q) {
  if (!q || typeof q !== 'object' || Array.isArray(q)) return '不是对象';
  if (!TYPE_LABEL[q.type]) return 'type 无法识别：' + (q.type == null ? '空' : q.type);
  if (isObjective(q.type)) {
    if (!Array.isArray(q.options) || q.options.length < 2) return '缺少 options';
    const ans = Array.isArray(q.answer) ? q.answer.join('') : String(q.answer == null ? '' : q.answer);
    if (!ans) return '缺少 answer';
    if (!/^[A-H]+$/i.test(ans)) return 'answer 不是选项字母：' + ans;
  } else if (q.type === 'material') {
    if (!Array.isArray(q.subQuestions) || !q.subQuestions.length) return '材料分析题缺少 subQuestions';
  } else {
    if (String(q.answer == null ? '' : q.answer).trim() === '') return '缺少 answer';
  }
  return '';
}
/* → { ok, error, state, notes[] }  — pure: never touches S */
function normalizeFullBackup(text) {
  const out = { ok: false, error: null, state: null, notes: [] };
  const clean = String(text || '').replace(/^\uFEFF/, '').trim();
  if (!clean) { out.error = '文件是空的'; return out; }
  let data;
  try { data = JSON.parse(clean); } catch (e) { out.error = '文件不是有效的 JSON：' + (e && e.message ? e.message : e); return out; }
  if (!data || typeof data !== 'object' || Array.isArray(data)) { out.error = '备份文件的顶层必须是一个对象'; return out; }
  if (data.passages || data.grammarQuestions || data.quizSets || data.roadmap) { out.error = '这是英语 Quiz Hub 的数据，不能导入到政治版'; return out; }
  const src = (data.state && typeof data.state === 'object' && !Array.isArray(data.state)) ? data.state : data;
  if (!Array.isArray(src.books)) { out.error = '备份文件格式不对：缺少 books 数组（这可能不是 Political Quiz Hub 的备份）'; return out; }
  if (!Array.isArray(src.chapters)) { out.error = '备份文件格式不对：缺少 chapters 数组'; return out; }
  if (!Array.isArray(src.questions)) { out.error = '备份文件格式不对：缺少 questions 数组'; return out; }

  const books = [], bookIds = new Set();
  for (let i = 0; i < src.books.length; i++) {
    const b = src.books[i];
    if (!b || typeof b !== 'object' || Array.isArray(b)) { out.error = '第 ' + (i + 1) + ' 本书不是对象'; return out; }
    const id = b.id == null ? '' : String(b.id);
    if (!id) { out.error = '第 ' + (i + 1) + ' 本书缺少 id'; return out; }
    if (bookIds.has(id)) { out.error = '书籍 id 重复：' + id; return out; }
    bookIds.add(id);
    books.push(Object.assign({}, b, { id: id, name: String(b.name == null ? '' : b.name) }));
  }
  if (!books.length && !src.questions.length) { out.error = '备份里没有任何书籍或题目'; return out; }

  const chapters = [], chIds = new Set(), chBook = {};
  for (let i = 0; i < src.chapters.length; i++) {
    const c = src.chapters[i];
    if (!c || typeof c !== 'object' || Array.isArray(c)) { out.error = '第 ' + (i + 1) + ' 个章节不是对象'; return out; }
    const id = c.id == null ? '' : String(c.id);
    if (!id) { out.error = '第 ' + (i + 1) + ' 个章节缺少 id'; return out; }
    if (chIds.has(id)) { out.error = '章节 id 重复：' + id; return out; }
    const bid = c.bookId == null ? '' : String(c.bookId);
    if (!bookIds.has(bid)) { out.error = '章节「' + String(c.name || id) + '」指向的书籍不存在（bookId=' + bid + '）'; return out; }
    chIds.add(id); chBook[id] = bid;
    chapters.push(Object.assign({}, c, { id: id, bookId: bid, name: String(c.name == null ? '' : c.name) }));
  }

  const questions = [], qIds = new Set(), qChapter = {}, qBook = {};
  let fixedBookRefs = 0;
  for (let i = 0; i < src.questions.length; i++) {
    const q = src.questions[i];
    const shapeErr = questionShapeError(q);
    if (shapeErr) { out.error = '第 ' + (i + 1) + ' 道题数据不完整：' + shapeErr; return out; }
    const id = q.id == null ? '' : String(q.id);
    if (!id) { out.error = '第 ' + (i + 1) + ' 道题缺少 id'; return out; }
    if (qIds.has(id)) { out.error = '题目 id 重复：' + id; return out; }
    const cid = q.chapterId == null ? '' : String(q.chapterId);
    if (!chIds.has(cid)) { out.error = '第 ' + (i + 1) + ' 道题指向的章节不存在（chapterId=' + cid + '）'; return out; }
    const bid = q.bookId == null ? '' : String(q.bookId);
    const realBid = chBook[cid];
    if (bid !== realBid) fixedBookRefs++;
    qIds.add(id); qChapter[id] = cid; qBook[id] = realBid;
    questions.push(Object.assign({}, q, { id: id, chapterId: cid, bookId: realBid }));
  }

  const answerLog = {};
  let droppedLogs = 0;
  if (src.answerLog && typeof src.answerLog === 'object' && !Array.isArray(src.answerLog)) {
    Object.keys(src.answerLog).forEach(k => {
      const v = src.answerLog[k];
      if (!qIds.has(String(k)) || !v || typeof v !== 'object' || Array.isArray(v)) { droppedLogs++; return; }
      answerLog[String(k)] = v;
    });
  }
  const wrongBook = [], seenQ = new Set();
  let droppedWrongs = 0;
  if (Array.isArray(src.wrongBook)) {
    src.wrongBook.forEach(w => {
      if (!w || typeof w !== 'object' || Array.isArray(w)) { droppedWrongs++; return; }
      const qid = w.qId == null ? '' : String(w.qId);
      if (!qIds.has(qid) || seenQ.has(qid)) { droppedWrongs++; return; }
      seenQ.add(qid);
      const rec = Object.assign({}, w);
      rec.qId = qid;
      rec.bookId = qBook[qid];
      rec.chapterId = qChapter[qid];
      if (!rec.id) rec.id = uid('wb');
      wrongBook.push(rec);
    });
  }
  if (fixedBookRefs) out.notes.push('修正了 ' + fixedBookRefs + ' 道题的 bookId（按所属章节归属）');
  if (droppedLogs) out.notes.push('忽略了 ' + droppedLogs + ' 条找不到对应题目的答题记录');
  if (droppedWrongs) out.notes.push('忽略了 ' + droppedWrongs + ' 条无效的错题记录');
  if (!books.length) out.notes.push('备份里没有书籍，导入后题库会是空的');

  out.state = {
    schemaVersion: SCHEMA,
    books: books, chapters: chapters, questions: questions,
    answerLog: answerLog, wrongBook: wrongBook,
    createdAt: src.createdAt || Date.now(),
    updatedAt: src.updatedAt || Date.now()
  };
  out.ok = true;
  return out;
}
function handleBackupFile(ev) {
  const f = ev.target.files && ev.target.files[0];
  if (!f) return;
  const say = html => setStatusHTML('polBackupStatus', html);
  const r = new FileReader();
  r.onload = () => {
    ev.target.value = '';
    const res = normalizeFullBackup(String(r.result || ''));
    if (!res.ok) {
      say('❌ 第 1 步校验未通过：' + esc(res.error) + '<br>当前数据未被修改。');
      toast('备份文件不可用，未改动任何数据', 3600);
      return;
    }
    const st = res.state;
    const due = st.wrongBook.filter(w => !w.mastered && !w.completed && (!w.nextReviewDate || w.nextReviewDate <= todayISO())).length;
    const msg = '用这个备份替换当前政治题库的全部数据？\n\n'
      + '备份内容：' + st.books.length + ' 本书 · ' + st.chapters.length + ' 个章节 · ' + st.questions.length + ' 道题\n'
      + '答题记录 ' + Object.keys(st.answerLog).length + ' 条 · 错题 ' + st.wrongBook.length + ' 条（待复习 ' + due + '）\n\n'
      + '当前数据（' + S.books.length + ' 本书 · ' + S.chapters.length + ' 个章节 · ' + S.questions.length + ' 道题）将被完全替换，包括所有书籍的答题记录与复习进度。\n\n'
      + (res.notes.length ? '注意：\n· ' + res.notes.join('\n· ') + '\n\n' : '')
      + '确定继续吗？';
    if (!confirm(msg)) { say('已取消导入，当前数据未被修改。'); toast('已取消备份导入', 2600); return; }
    /* ---- commit: replace the whole state in one shot ---- */
    S = migrateState(st);
    cleanOrphans();
    save();
    UI = { view: 'home', bookId: null, chapterId: null, reviewBookId: 'all' };
    saveUI(); rv = null; cardState = {}; importTarget = null;
    render();
    say('✅ 已恢复备份：<b>' + S.books.length + '</b> 本书 · <b>' + S.chapters.length + '</b> 个章节 · <b>' + S.questions.length + '</b> 道题 · 答题记录 <b>' + Object.keys(S.answerLog).length + '</b> 条 · 错题 <b>' + S.wrongBook.length + '</b> 条。'
      + (res.notes.length ? '<br>' + esc(res.notes.join('；')) : ''));
    toast('已恢复备份：' + S.books.length + ' 本书 · ' + S.questions.length + ' 道题', 3200);
  };
  r.onerror = () => { say('❌ 文件读取失败，当前数据未被修改。'); toast('文件读取失败'); };
  r.readAsText(f, 'utf-8');
}

/* ================================================================
   SIDEBAR (same behaviour as the original) + INIT
   ================================================================ */
let sidebarCollapsed = true, lastIsMobile = false;
function isMobileViewport() { return window.innerWidth <= 768; }
function applySidebar() {
  const app = document.getElementById('app');
  app.classList.toggle('sidebar-collapsed', sidebarCollapsed);
}
function toggleSidebar() {
  sidebarCollapsed = !sidebarCollapsed;
  try { localStorage.setItem(SIDEBAR_KEY, JSON.stringify(sidebarCollapsed)); } catch (e) {}
  applySidebar();
}
function collapseSidebarOnMobile() { if (isMobileViewport() && !sidebarCollapsed) { sidebarCollapsed = true; applySidebar(); } }
function onResize() {
  const m = isMobileViewport();
  if (m === lastIsMobile) return;
  lastIsMobile = m;
  if (m) sidebarCollapsed = true;
  else { let p = null; try { p = JSON.parse(localStorage.getItem(SIDEBAR_KEY)); } catch (e) {} sidebarCollapsed = p === null ? false : !!p; }
  applySidebar();
}
let lastRenderDate = todayISO();
function init() {
  loadState();
  lastIsMobile = isMobileViewport();
  if (lastIsMobile) sidebarCollapsed = true;
  else { let p = null; try { p = JSON.parse(localStorage.getItem(SIDEBAR_KEY)); } catch (e) {} sidebarCollapsed = p === null ? false : !!p; }
  applySidebar();
  const app = document.getElementById('app');
  app.addEventListener('click', e => { if (e.target === app && isMobileViewport() && !sidebarCollapsed) { sidebarCollapsed = true; applySidebar(); } });
  window.addEventListener('resize', onResize);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && todayISO() !== lastRenderDate) { lastRenderDate = todayISO(); render(); }
  });
  render();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
}
init();
